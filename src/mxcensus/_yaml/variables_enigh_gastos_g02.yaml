    '10': Universidades públicas
    '11': Otros servicios:Cruz Roja, Cruz Verde, etc.
    '12': PROGRESA U OPORTUNIDADES
    '13': Provenientes de otro hogar
fpago:
  Descripción: Forma de pago
  Pregunta: Este artículo o servicio ¿lo pagó...?
  Tipo: categorical
  Longitud: '3'
  Categorías:
    '001': De contado
    '002': Con tarjeta de crédito bancaria o comercial
    '003': Fiado (persona particular o establecimiento comercial)
    '021': De contado y con tarjeta de crédito bancaria o comercial
    '031': De contado y fiado (persona particular o establecimiento comercial)
    '032': Con tarjeta de crédito bancaria o comercial y fiado (persona particular o establecimiento comercial)
gasto:
  Descripción: Gasto efectuado
  Pregunta: ¿Cuánto pagó el mes pasado?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
  Especiales:
    '-1': No especificado
pago_mp:
  Descripción: Pago mes pasado
  Pregunta: ¿Cuánto pagó en total el mes pasado?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
inmujer:
  Descripción: Gasto mujeres
  Pregunta: ¿Cuánto gastó en total para mujeres y niñas?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
gas_tri:
  Descripción: Gasto trimestral
  Pregunta: ''
  Tipo: numeric
  Longitud: '15'
  Categorías: {}
  Especiales:
    '-1': No especificado
