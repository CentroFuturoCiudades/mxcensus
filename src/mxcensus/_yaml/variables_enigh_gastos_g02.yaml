folioviv:
  Descripción: Identificador de la vivienda (folio). Los dos primeros caracteres son la clave de la entidad
    federativa.
  Tipo: string
  Longitud: 6 (2008–2012) / 10 (2014+)
  Categorías: {}
foliohog:
  Descripción: Identificador del hogar dentro de la vivienda.
  Tipo: string
  Longitud: '1'
  Categorías: {}
clave:
  Descripción: Clave de gasto
  Pregunta: Durante el mes de ____________, ¿compró o estuvo pagando algún artículo o servicio de los
    que le voy a mencionar?
  Tipo: string
  Longitud: '4'
  Categorías: {}
  Nota: catálogo de 465 códigos (no enumerado)
lug_com:
  Descripción: Lugar de compra
  Pregunta: ¿Dónde compró este artículo o servicio?
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '01': Mercado
    '02': Tianguis o mercado sobre ruedas
    '03': Vendedores ambulantes
    '04': Tiendas de abarrotes
    '05': Tiendas específicas del ramo (mueblerías, jugueterías, zapaterías, etcétera)
    '06': Supermercados
    '07': Tiendas departamentales
    08: Compras fuera del país
    09: Tiendas con membresía
    '10': Tiendas de conveniencia
    '15': Diconsa
    '16': Lechería Linconsa
    '17': Persona particular
    '18': Internet
inst1:
  Descripción: Organización o institución
  Pregunta: ¿En dónde recibió el servicio y/o los productos?
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '01': Médicos particulares
    '02': IMSS
    '03': ISSSTE
    '04': PEMEX
    '05': DE LA MARINA
    '06': EJÉRCITO
    '07': SSA
    08: SSA con Seguro Popular
    09: DIF
    '10': Universidades públicas
    '11': Otros servicios:Cruz Roja, Cruz Verde, etc.
    '12': PROGRESA U OPORTUNIDADES
    '13': Provenientes de otro hogar
inst2:
  Descripción: Organización o institución
  Pregunta: ¿En dónde recibió el servicio y/o los productos?
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '01': Médicos particulares
    '02': IMSS
    '03': ISSSTE
    '04': PEMEX
    '05': DE LA MARINA
    '06': EJÉRCITO
