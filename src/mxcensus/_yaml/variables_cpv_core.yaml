# CPV-family core variable dictionary (hand-curated; censos, conteos y encuestas
# intercensales — docs/cpv/PLAN.md).
#
# Authoritative entries for the variables every CPV table shares: the record keys, the
# geography, the sample-design and expansion-factor fields, and the main demographic items.
# Unlike the per-group files (variables_cpv_{table}_{gNN}.yaml — generated by
# scripts/build_cpv.py --variables from INEGI's dictionary + the data), this file is
# maintained by hand and takes precedence over them, in every table that has the column.
# It is NEVER regenerated. A variable joins the core only after its codes are verified in
# every edition it covers; so far the core is verified for the Encuesta Intercensal 2025
# (eic2025_micro_fd.xlsx + the 2025 microdata and estimaciones files), the Censo 2020
# cuestionario ampliado (diccionario_cuestionario_ampliado_cpv2020.xlsx + the 2020
# microdata: every entry below that a 2020 table carries has the same codes there) and the
# Encuesta Intercensal 2015 (eic2015_fd.xls + the 2015 microdata: the same codes, except
# that the 2015 CSVs drop leading zeros — ID_VIV/ID_PERSONA in states 01-09 and CLAVIVP,
# whose Alias maps 1…9 onto 01…09; harmonize=True pads all three) and the Censo 2010
# cuestionario ampliado (diccionario_cuestionario_ampliado.xls + the 2010 DBF microdata: the
# same codes for every entry below except CLAVIVP — another classification, so it carries
# Periodos — and the keys, which are state-scoped serials that harmonize=True rebuilds).
#
# Entry contract (shared with the ENOE/ENIGH cores and the generated files; read by
# mxcensus._schema_groups):
#   Descripción  human-readable label            Pregunta   question text (optional)
#   Tipo         categorical | numeric | string  Longitud   field width (informative)
#   Categorías   {code: label} — a non-empty map makes the variable categorical; keys use
#                the spelling found in the CSV (CLAVIVP is zero-padded, SEXO is not)
#   Especiales   {code: label} sentinel codes: extra categories for a categorical (they are
#                information — "No especificado"), NA for a numeric
#   Ordenada     true → ordered categorical, in the order the categories are listed
#   Rango        [min, max] inclusive bounds checked on a numeric column
#   Alias        {raw spelling: canonical code} applied before labelling
#   Decimales    non-empty → float column, otherwise integer
#   Tablas       (CPV only) the tables the entry applies to; default every table that has
#                the column. TAMLOC is the microdata's 5-class locality size — the 2020
#                ITER's TAMLOC is a different, 14-class scale and keeps its own entry.
#   Periodos     (CPV only) the editions whose codes the entry was verified for; default
#                every edition. Outside them the column keeps its own dictionary entry, is
#                not padded by harmonize=True and is not checked against the core (CPV 2010's
#                CLAVIVP 1…7 is another classification than 2015-2025's 01…09).
# The generated CPV files may also carry informative keys that no code reads: Catálogo
# (the INEGI classification catalog that enumerates a coded string — occupation, activity,
# country…), Definición and Rangos (an aggregate indicator's definition and its verbatim
# range text), and Nota (build notes).
#
# Names are the CSV's (upper case) or, for the geography, the harmonized spelling (the latest
# edition's and the Marco Geoestadístico's: CVE_ENT/CVE_MUN/CVE_LOC/CVE_AGEB/CVE_MZA — the
# 2020 ENT/ENTIDAD/MUN/LOC/AGEB/MZA are renamed onto them by harmonize=True, mxcensus.cpv).
# Keys and geographic codes are strings: they keep their zero-padding so files stay joinable
# (ID_PERSONA[:12] == ID_VIV; CVEGEO == CVE_ENT+CVE_MUN).

# --- record keys: dwelling ⊃ person; dwelling ⊃ international emigrant ------------------
ID_VIV:
  Descripción: Identificador único de la vivienda (2015, 2020 y 2025 — 12 dígitos; los dos
    primeros son la entidad, así que es único en todo el país). Los CSV de 2015 lo escriben
    sin el cero inicial de las entidades 01-09 (11 dígitos); harmonize=True lo rellena. En
    2010 es un consecutivo de 8 dígitos único sólo dentro de la entidad; harmonize=True le
    antepone la entidad (entidad + consecutivo a 10 dígitos).
  Tipo: string
  Longitud: '12'
ID_PERSONA:
  Descripción: Identificador único de la persona — ID_VIV más el número de persona (2020 y
    2025 — 17 dígitos; 2015 — 14, sin el cero inicial de las entidades 01-09 en los CSV;
    harmonize=True lo rellena). 2010 trae ID_PER, un consecutivo de 9 dígitos único dentro de
    la entidad; harmonize=True deriva ID_PERSONA = ID_VIV + NUMPER (5 dígitos, 17 en total).
  Tipo: string
  Longitud: 14 / 17
ID_MII:
  Descripción: Identificador único del emigrante internacional (tabla de migrantes; 2020 y
    2025 — 14 dígitos, ID_VIV + número de emigrante). Los migrantes cuelgan de la vivienda
    (ID_VIV), no de una persona. 2010 trae ID_MIN, un consecutivo de 7 dígitos único dentro
    de la entidad; harmonize=True deriva ID_MII = ID_VIV + el orden del emigrante en la
    vivienda según ID_MIN (2 dígitos).
  Tipo: string
  Longitud: '14'

# --- geography ----------------------------------------------------------------------------
CVEGEO:
  Descripción: Clave geoestadística integrada, la concatenación de las claves geográficas
    que lleva la tabla (como en el Marco Geoestadístico). Microdatos — entidad + municipio
    (5 dígitos); estimaciones e ITER — + localidad (9); AGEB — + AGEB + manzana (16). Los
    renglones de totales llevan sus partes en cero (00/000/0000/0000/000). Los archivos de
    2020 no la traen; harmonize=True la deriva.
  Tipo: string
  Longitud: 5 / 9 / 16
CVE_ENT:
  Descripción: Clave del Área Geoestadística Estatal (01-32; 00 = total nacional en las
    estimaciones). En 2010, 2015 y 2020 se llama ENT en los microdatos; en 2020, ENTIDAD en
    el ITER y el AGEB.
  Tipo: string
  Longitud: '2'
CVE_MUN:
  Descripción: Clave del Área Geoestadística Municipal (001-570; 000 = total estatal en las
    estimaciones, el ITER y el AGEB; 997 = localidades de menos de 50 000 habitantes de la
    entidad en las estimaciones). En 2010, 2015 y 2020 se llama MUN.
  Tipo: string
  Longitud: '3'
LOC50K:
  Descripción: Clave de la localidad de 50 000 y más habitantes dentro del municipio; 0000 =
    localidad de menos de 50 000 habitantes
  Tipo: string
  Longitud: '4'
CVE_LOC:
  Descripción: Clave de la localidad. Estimaciones — localidad de 50 000 y más habitantes,
    0000 = total del municipio, 9997 = localidades de menos de 50 000 habitantes de la
    entidad. ITER y AGEB (LOC en 2020) — toda localidad, 0000 = total de la entidad o del
    municipio; en el ITER 9998/9999 = localidades de una/dos viviendas.
  Tipo: string
  Longitud: '4'
CVE_AGEB:
  Descripción: Clave del AGEB urbana dentro de la localidad (AGEB en 2020) — tres dígitos y
    un carácter 0-9 o A-P; 0000 = total de la entidad, del municipio o de la localidad.
  Tipo: string
  Longitud: '4'
CVE_MZA:
  Descripción: Clave de la manzana dentro del AGEB (MZA en 2020); 000 = total del AGEB o de
    un nivel superior.
  Tipo: string
  Longitud: '3'
TAMLOC:
  Descripción: Tamaño de localidad (microdatos de 2015, 2020 y 2025; los de 2010 traen
    TAM_LOC, una escala de cuatro clases que junta 15 000-99 999 habitantes y no se renombra)
  Tipo: categorical
  Longitud: '1'
  Tablas: [viviendas, personas, migrantes]
  Ordenada: true
  Categorías:
    '1': Menos de 2 500 habitantes
    '2': De 2 500 a 14 999 habitantes
    '3': De 15 000 a 49 999 habitantes
    '4': De 50 000 a 99 999 habitantes
    '5': 100 000 y más habitantes

# --- sample design and expansion factor ----------------------------------------------------
COBERTURA:
  Descripción: Tipo de cobertura en el municipio (EIC 2015, cuestionario ampliado del Censo
    2020 y EIC 2025)
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Municipio censado
    '2': Municipio muestreado
    '3': Municipio con muestra insuficiente
ESTRATO:
  Descripción: Estrato de diseño muestral (alfanumérico, p. ej. 400-01-001-0003 en 2010,
    01-001-05 en 2015, 01-001-0000-03 en 2020 y 15-001-0000-030 en 2025)
  Tipo: string
  Longitud: 9 / 14 / 15
UPM:
  Descripción: Unidad Primaria de Muestreo (4 dígitos en 2010, 6 en 2015, 5 en 2020 y 2025)
  Tipo: string
  Longitud: 4 / 5 / 6
FACTOR:
  Descripción: Factor de expansión (constante dentro de la vivienda; calibrado a las
    estimaciones publicadas — Σ FACTOR = población / viviendas particulares habitadas)
  Tipo: numeric
  Longitud: '5'
  Rango: [1, 99999]
TIPO_REG:
  Descripción: Registro imputado — identificador de registros imputados
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': Encuestado
    '1': Imputado

# --- dwelling class (in every microdata table of 2020 and 2025; viviendas in 2015) ----------
# 2010 (every table) classifies dwellings differently (1 casa independiente, 2 departamento,
# 3 vecindad, 4 cuarto de azotea, 5 local no construido, 6 móvil, 7 refugio, 9 no
# especificado): its CLAVIVP keeps the 2010 dictionary entry (Periodos).
CLAVIVP:
  Descripción: Clase de vivienda particular. Las clases 07 (local no construido para
    habitación) y 09 (refugio) no tienen características de la vivienda (bloque PAREDES…
    SERV_TV_PAGA vacío). En 2015 los códigos van sin cero inicial (1…9, 99) y INEGI rotula
    la clase 03 «Casa dúplex, triple o cuádruple» y la 06 «Cuarto en la azotea de un
    edificio».
  Tipo: categorical
  Longitud: '2'
  Periodos: ['2015', '2020', '2025']
  Categorías:
    '01': Casa única en el terreno
    '02': Casa que comparte terreno con otra(s)
    '03': Casa dúplex
    '04': Departamento en edificio
    '05': Vivienda en vecindad o cuartería
    '06': Vivienda en cuarto de azotea de un edificio
    '07': Local no construido para habitación
    '08': Vivienda móvil
    '09': Refugio
  Especiales:
    '99': No especificado de vivienda particular
  Alias:
    '1': '01'
    '2': '02'
    '3': '03'
    '4': '04'
    '5': '05'
    '6': '06'
    '7': '07'
    '8': '08'
    '9': '09'

# --- demographics ---------------------------------------------------------------------------
SEXO:
  Descripción: Sexo (códigos 1 y 3 en 2010, 2015, 2020 y 2025)
  Pregunta: (NOMBRE) es hombre. (NOMBRE) es mujer.
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Hombre
    '3': Mujer
EDAD:
  Descripción: Edad en años cumplidos (0 = menos de un año; en 2015, 110 = 110 y más; 2010 la
    escribe con tres dígitos, 000-130)
  Pregunta: ¿Cuántos años cumplidos tiene (NOMBRE)?
  Tipo: numeric
  Longitud: '3'
  Rango: [0, 130]
  Especiales:
    '999': No especificado

# --- aggregate products (estimaciones) ---------------------------------------------------------
ESTIMADOR:
  Descripción: Tipo de estimador de cada renglón de las estimaciones (cinco renglones por
    área geográfica; los límites de confianza son al 90 por ciento)
  Tipo: categorical
  Longitud: '50'
  Categorías:
    Valor: Valor
    Error estándar: Error estándar
    Límite inferior de confianza: Límite inferior de confianza
    Límite superior de confianza: Límite superior de confianza
    Coeficiente de variación: Coeficiente de variación
