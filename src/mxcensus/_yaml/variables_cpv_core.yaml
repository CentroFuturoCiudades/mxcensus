# CPV-family core variable dictionary (hand-curated; censos, conteos y encuestas
# intercensales — docs/cpv/PLAN.md).
#
# Authoritative entries for the variables every CPV table shares: the record keys, the
# geography, the sample-design and expansion-factor fields, and the main demographic items.
# Unlike the per-group files (variables_cpv_{table}_{gNN}.yaml — generated by
# scripts/build_cpv.py --variables from INEGI's dictionary + the data), this file is
# maintained by hand and takes precedence over them, in every table that has the column.
# It is NEVER regenerated. A variable joins the core only after its codes are verified in
# every edition it covers; so far the core is verified for the Encuesta Intercensal 2025
# (eic2025_micro_fd.xlsx + the 2025 microdata and estimaciones files) and the Censo 2020
# cuestionario ampliado (diccionario_cuestionario_ampliado_cpv2020.xlsx + the 2020
# microdata: every entry below that a 2020 table carries has the same codes there).
#
# Entry contract (shared with the ENOE/ENIGH cores and the generated files; read by
# mxcensus._schema_groups):
#   Descripción  human-readable label            Pregunta   question text (optional)
#   Tipo         categorical | numeric | string  Longitud   field width (informative)
#   Categorías   {code: label} — a non-empty map makes the variable categorical; keys use
#                the spelling found in the CSV (CLAVIVP is zero-padded, SEXO is not)
#   Especiales   {code: label} sentinel codes: extra categories for a categorical (they are
#                information — "No especificado"), NA for a numeric
#   Ordenada     true → ordered categorical, in the order the categories are listed
#   Rango        [min, max] inclusive bounds checked on a numeric column
#   Alias        {raw spelling: canonical code} applied before labelling
#   Decimales    non-empty → float column, otherwise integer
#   Tablas       (CPV only) the tables the entry applies to; default every table that has
#                the column. TAMLOC is the microdata's 5-class locality size — the 2020
#                ITER's TAMLOC is a different, 14-class scale and keeps its own entry.
# The generated CPV files may also carry informative keys that no code reads: Catálogo
# (the INEGI classification catalog that enumerates a coded string — occupation, activity,
# country…), Definición and Rangos (an aggregate indicator's definition and its verbatim
# range text), and Nota (build notes).
#
# Names are the CSV's (upper case). Keys and geographic codes are strings: they keep their
# zero-padding so files stay joinable (ID_PERSONA[:12] == ID_VIV; CVEGEO == CVE_ENT+CVE_MUN).

# --- record keys: dwelling ⊃ person; dwelling ⊃ international emigrant ------------------
ID_VIV:
  Descripción: Identificador único de la vivienda (2020 y 2025 — 12 dígitos; los dos
    primeros son la entidad, así que es único en todo el país)
  Tipo: string
  Longitud: '12'
ID_PERSONA:
  Descripción: Identificador único de la persona (2020 y 2025 — 17 dígitos; los primeros
    12 son ID_VIV)
  Tipo: string
  Longitud: '17'
ID_MII:
  Descripción: Identificador único del emigrante internacional (tabla de migrantes; 2020 y
    2025 — 14 dígitos, ID_VIV + número de emigrante). Los migrantes cuelgan de la vivienda
    (ID_VIV), no de una persona.
  Tipo: string
  Longitud: '14'

# --- geography ----------------------------------------------------------------------------
CVEGEO:
  Descripción: Clave geoestadística integrada. Microdatos — entidad + municipio (5
    dígitos); estimaciones — entidad + municipio + localidad (9 dígitos), con 00/000/0000
    para los totales nacional, estatal y municipal.
  Tipo: string
  Longitud: 5 / 9
CVE_ENT:
  Descripción: Clave del Área Geoestadística Estatal (01-32; 00 = total nacional en las
    estimaciones)
  Tipo: string
  Longitud: '2'
CVE_MUN:
  Descripción: Clave del Área Geoestadística Municipal (001-570; en las estimaciones 000 =
    total estatal y 997 = localidades de menos de 50 000 habitantes de la entidad)
  Tipo: string
  Longitud: '3'
LOC50K:
  Descripción: Clave de la localidad de 50 000 y más habitantes dentro del municipio; 0000 =
    localidad de menos de 50 000 habitantes
  Tipo: string
  Longitud: '4'
CVE_LOC:
  Descripción: Clave de la localidad de 50 000 y más habitantes (estimaciones); 0000 = total
    del municipio, 9997 = localidades de menos de 50 000 habitantes de la entidad
  Tipo: string
  Longitud: '4'
TAMLOC:
  Descripción: Tamaño de localidad (microdatos)
  Tipo: categorical
  Longitud: '1'
  Tablas: [viviendas, personas, migrantes]
  Ordenada: true
  Categorías:
    '1': Menos de 2 500 habitantes
    '2': De 2 500 a 14 999 habitantes
    '3': De 15 000 a 49 999 habitantes
    '4': De 50 000 a 99 999 habitantes
    '5': 100 000 y más habitantes

# --- sample design and expansion factor ----------------------------------------------------
COBERTURA:
  Descripción: Tipo de cobertura en el municipio (cuestionario ampliado del Censo 2020 y
    EIC 2025)
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Municipio censado
    '2': Municipio muestreado
    '3': Municipio con muestra insuficiente
ESTRATO:
  Descripción: Estrato de diseño muestral (alfanumérico, p. ej. 01-001-0000-03 en 2020 y
    15-001-0000-030 en 2025)
  Tipo: string
  Longitud: 14 / 15
UPM:
  Descripción: Unidad Primaria de Muestreo
  Tipo: string
  Longitud: '5'
FACTOR:
  Descripción: Factor de expansión (constante dentro de la vivienda; calibrado a las
    estimaciones publicadas — Σ FACTOR = población / viviendas particulares habitadas)
  Tipo: numeric
  Longitud: '5'
  Rango: [1, 99999]
TIPO_REG:
  Descripción: Registro imputado — identificador de registros imputados
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': Encuestado
    '1': Imputado

# --- dwelling class (in every microdata table, 2020 and 2025) --------------------------------
CLAVIVP:
  Descripción: Clase de vivienda particular. Las clases 07 (local no construido para
    habitación) y 09 (refugio) no tienen características de la vivienda (bloque PAREDES…
    SERV_TV_PAGA vacío).
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '01': Casa única en el terreno
    '02': Casa que comparte terreno con otra(s)
    '03': Casa dúplex
    '04': Departamento en edificio
    '05': Vivienda en vecindad o cuartería
    '06': Vivienda en cuarto de azotea de un edificio
    '07': Local no construido para habitación
    '08': Vivienda móvil
    '09': Refugio
  Especiales:
    '99': No especificado de vivienda particular

# --- demographics ---------------------------------------------------------------------------
SEXO:
  Descripción: Sexo (códigos 1 y 3, como en el Censo 2020)
  Pregunta: (NOMBRE) es hombre. (NOMBRE) es mujer.
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Hombre
    '3': Mujer
EDAD:
  Descripción: Edad en años cumplidos (0 = menos de un año)
  Pregunta: ¿Cuántos años cumplidos tiene (NOMBRE)?
  Tipo: numeric
  Longitud: '3'
  Rango: [0, 130]
  Especiales:
    '999': No especificado

# --- aggregate products (estimaciones) ---------------------------------------------------------
ESTIMADOR:
  Descripción: Tipo de estimador de cada renglón de las estimaciones (cinco renglones por
    área geográfica; los límites de confianza son al 90 por ciento)
  Tipo: categorical
  Longitud: '50'
  Categorías:
    Valor: Valor
    Error estándar: Error estándar
    Límite inferior de confianza: Límite inferior de confianza
    Límite superior de confianza: Límite superior de confianza
    Coeficiente de variación: Coeficiente de variación
