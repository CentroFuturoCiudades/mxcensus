TOTVIVH:
  Descripción: Total de viviendas habitadas
  Definición: 'Total de viviendas Vivienda: Espacio delimitado normalmente por paredes y techos de cualquier
    material, donde viven una o más personas, duermen, preparan sus alimentos, comen y se protegen del
    medio ambiente; además, la entrada a la vivienda debe ser independiente, es decir, que sus ocupantes
    puedan entrar o salir de ella sin pasar por el interior de los cuartos de otra vivienda. Para el Conteo
    de Población y Vivienda, las viviendas se clasifican en particulares y colectivas.'
  Tipo: numeric
  Longitud: '9'
  Rangos: 0..999999999
  Categorías: {}
  Especiales:
    '*': Dato reservado por confidencialidad
