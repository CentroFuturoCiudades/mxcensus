entidad:
  Descripción: Clave de Entidad Federativa
  Definición: Código que identifica a la entidad federativa.
  Tipo: string
  Longitud: '2'
  Rangos: 01..32
nom_ent:
  Descripción: Entidad Federativa
  Definición: Nombre oficial de la entidad federativa.
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
mun:
  Descripción: Clave del Municipio
  Definición: Código que identifica al municipio al interior de una entidad federativa, conforme al Marco
    Geoestadístico Nacional.
  Tipo: string
  Longitud: '3'
  Rangos: 001..570
nom_mun:
  Descripción: Municipio
  Definición: Nombre oficial del municipio o delegación política en el caso del Distrito Federal.
  Tipo: string
  Longitud: '55'
  Rangos: Alfanumérico
loc:
  Descripción: Clave de Localidad
  Definición: Código que identifica a la localidad, al interior de cada municipio (o delegación política)
    conforme al Marco Geoestadístico Nacional.
  Tipo: string
  Longitud: '4'
  Rangos: 0001..9999
nom_loc:
  Descripción: Localidad
  Definición: Nombre con el que se reconoce a la localidad dado por la ley o la costumbre.
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
longitud:
  Descripción: Longitud
  Definición: Ubicación de la localidad al Oeste del Meridiano de Greenwich, expresada en grados, minutos
    y segundos. Las últimas dos posiciones corresponden a los segundos; las siguientes dos posiciones
    a la izquierda indican los minutos y las dos o tres primeras posiciones de la derecha corresponden
    a los grados.
  Tipo: string
  Longitud: '7'
  Rangos: Alfanumérico
latitud:
  Descripción: Latitud
  Definición: Ubicación de la localidad al norte del Ecuador, expresada en grados, minutos y segundos.
    Las primeras dos posiciones corresponden a los grados; las siguientes dos a los minutos y las últimas
    dos posiciones a los segundos.
  Tipo: string
  Longitud: '6'
  Rangos: Alfanumérico
altitud:
  Descripción: Altitud
  Definición: Altura a la que se encuentra una localidad, respecto al nivel medio del mar, expresada en
    metros.
  Tipo: string
  Longitud: '4'
  Rangos: Alfanumérico
p_total:
  Descripción: Población total
  Definición: Total de personas que residen habitualmente en el país, entidad federativa, municipio o
    localidad. Incluye la estimación del número de personas en viviendas particulares sin información
    de ocupantes. Incluye a la población que no especificó su edad.
  Tipo: numeric
  Longitud: '10'
  Rangos: 00..9999999999
  Categorías: {}
  Especiales:
    '*': Dato reservado por confidencialidad
p_mas:
  Descripción: Población masculina
  Definición: Total de hombres. Incluye la estimación del número de hombres en viviendas particulares
