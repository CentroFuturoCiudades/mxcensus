LONGITUD:
  Descripción: Longitud 1/
  Definición: 'Medida angular que existe entre cualquier punto de la superficie terrestre y el meridiano
    arbitrario (Meridiano de Greenwich), su cálculo o medición se representa gráficamente por un arco
    dividido en grados de 0 a 180 añadiéndoles las expresiones: "E" para el este y "W" para el oeste.'
  Tipo: string
  Longitud: '7'
  Rangos: Alfanumérico
LATITUD:
  Descripción: Latitud 1/
  Definición: 'Medida angular que existe desde cualquier punto de la superficie terrestre hasta el Ecuador,
    su medición o cálculo se representa gráficamente por un arco dividido en grados de 0 a 90 añadiéndoles
    las expresiones: "N" para el hemisferio norte boreal y "S" para el hemisferio sur o austral.'
  Tipo: string
  Longitud: '6'
  Rangos: Alfanumérico
ALTITUD:
  Descripción: Altitud 1/
  Definición: Altura de un punto de la tierra con relación al nivel de mar.
  Tipo: string
  Longitud: '4'
