MUN:
  Descripción: Municipio o Delegación
  Tipo: string
  Longitud: '3'
  Nota: 001..570 = códigos (no enumerados)
LOC:
  Descripción: Localidad (Clave)
  Tipo: string
  Longitud: '4'
  Nota: 0001..9999 = códigos (no enumerados)
NUMVIV:
  Descripción: Número de vivienda
  Tipo: string
  Longitud: '6'
  Nota: 000001..999999 = códigos (no enumerados)
NUMHOG:
  Descripción: Número de hogar
  Tipo: numeric
  Longitud: '1'
  Rango:
  - 1
  - 9
  Categorías: {}
FACTOR:
  Descripción: Factor de expansión (constante dentro de la vivienda; calibrado a las estimaciones publicadas
    — Σ FACTOR = población / viviendas particulares habitadas). La muestra del Conteo 2005 no tiene factor.
  Tipo: numeric
  Longitud: '5'
  Rango:
  - 1
  - 99999
ESTRATO:
  Descripción: Estrato de diseño muestral (alfanumérico, p. ej. 0100101022 en 2000, 400-01-001-0003 en
    2010, 01-001-05 en 2015, 01-001-0000-03 en 2020 y 15-001-0000-030 en 2025; 2005 no tiene diseño expandible)
  Tipo: string
  Longitud: 9 / 10 / 14 / 15
UPM:
  Descripción: Unidad Primaria de Muestreo (4 dígitos en 2000 y 2010, 6 en 2015, 5 en 2020 y 2025)
  Tipo: string
  Longitud: 4 / 5 / 6
TAM_LOC:
  Descripción: Tamaño de localidad
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Menor a 2,500 habitantes
    '2': 2,500 a 14,999 habitantes
    '3': 15,000 a 19,999 habitantes
    '4': 20,000 a 49,999 habitantes
    '5': 50,000 a 99,999 habitantes
    '6': 100,000 a 499,999 habitantes
    '7': 500,000 y más habitantes
