  Longitud: '1'
  Categorías:
    '1': ENOE
    '2': ENOE-CATI
mes_cal:
  Descripción: Mes calendario — clasificación mensual del registro; base del ponderador mensual FAC_MEN
    (presente desde 2020-T3). Los códigos de mes se emiten sin cero a la izquierda en el CSV (1-12). Códigos
    especiales 96-99 por trimestre (Q1=96, Q2=97, Q3=98, Q4=99) — registros sin mes calendario específico.
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '1': Enero
    '2': Febrero
    '3': Marzo
    '4': Abril
    '5': Mayo
    '6': Junio
    '7': Julio
    '8': Agosto
    '9': Septiembre
    '10': Octubre
    '11': Noviembre
    '12': Diciembre
    '96': Sin mes calendario específico (trimestre 1)
    '97': Sin mes calendario específico (trimestre 2)
    '98': Sin mes calendario específico (trimestre 3)
    '99': Sin mes calendario específico (trimestre 4)
