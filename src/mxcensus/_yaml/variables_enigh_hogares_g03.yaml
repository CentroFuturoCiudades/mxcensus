folioviv:
  Descripción: Identificador de la vivienda (folio). Los dos primeros caracteres son la clave de la entidad
    federativa.
  Tipo: string
  Longitud: 6 (2008–2012) / 10 (2014+)
  Categorías: {}
foliohog:
  Descripción: Identificador del hogar dentro de la vivienda.
  Tipo: string
  Longitud: '1'
  Categorías: {}
huespedes:
  Descripción: Huéspedes que pagan por dormir
  Pregunta: Hay personas en este hogar que paguen por dormir aquí en sus vivienda ¿Cuántos?
  Tipo: numeric
  Longitud: '1'
  Categorías: {}
huesp_come:
  Descripción: Huéspedes que pagan por comer
  Pregunta: ¿De esa o esas personas cuántas de ellas también le pagan para comer en este hogar?
  Tipo: numeric
  Longitud: '1'
  Categorías: {}
num_trab_d:
  Descripción: Número de trabajadores domésticos
  Pregunta: ¿Cuántos son, incluyendo a los familiares de éstos?
  Tipo: numeric
  Longitud: '1'
  Categorías: {}
trab_come:
  Descripción: Trabajadores domésticos que comen
  Pregunta: ¿De esa o esas personas cuántas de ellas comen de los alimentos que se preparan en este hogar
    ?
  Tipo: numeric
  Longitud: '1'
  Categorías: {}
acc_alim1:
  Descripción: Preocupación comida se acabe
  Pregunta: ¿En los últimos tres meses, por falta de dinero o recursos ¿alguna vez usted se preocupó de
    que la comida se acabara?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
acc_alim2:
  Descripción: Sin comida
  Pregunta: ¿En los últimos tres meses, por falta de dinero o recursos ¿alguna vez usted se quedaron sin
    comida?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
acc_alim3:
  Descripción: Poca variedad de alimentos
  Pregunta: ¿En los últimos tres meses, alguna vez se quedaron sin dinero o recursos para obtener una
    alimentación sana y variada?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
acc_alim4:
  Descripción: Adulto poca variedad de alimentos
  Pregunta: En los últimos tres meses, por falta de dinero o recursos ¿alguna vez usted o algún adulto
    en su hogar tuvo una alimentación basada en muy poca variedad de alimentos?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
acc_alim5:
  Descripción: Dejó algún alimento
  Pregunta: ¿En los últimos tres meses, por falta de dinero o recursos ¿alguna vez usted o algún adulto
    en su hogar dejó de desayunar, comer o cenar?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
acc_alim6:
  Descripción: Comió menos
  Pregunta: En los últimos tres meses, por falta de dinero o recursos ¿alguna vez usted o algún adulto
    en su hogar comió menos de lo que usted piensa debía comer?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
acc_alim7:
  Descripción: Sintió hambre y no comió
  Pregunta: ¿En los últimos tres meses, por falta de dinero o recursos, ¿alguna vez usted o algún adulto
    en su hogar sintió hambre pero no comió?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
acc_alim8:
  Descripción: Una o menos comidas
  Pregunta: En los últimos tres meses, por falta de dinero o recursos ¿alguna vez usted o algún adulto
    en su hogar sólo comió una vez al día o dejó de comer todo un día?
