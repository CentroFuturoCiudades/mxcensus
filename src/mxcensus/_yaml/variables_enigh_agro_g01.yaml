folioviv:
  Descripción: Identificador de la vivienda (folio). Los dos primeros caracteres son la clave de la entidad
    federativa.
  Tipo: string
  Longitud: 6 (2008–2012) / 10 (2014+)
  Categorías: {}
foliohog:
  Descripción: Identificador del hogar dentro de la vivienda.
  Tipo: string
  Longitud: '1'
  Categorías: {}
numren:
  Descripción: Número de renglón (identificador de la persona dentro del hogar).
  Tipo: string
  Longitud: '2'
  Categorías: {}
numtrab:
  Descripción: Identificador del trabajo
  Pregunta: ''
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Trabajo principal
    '2': Trabajo secundario
tipoact:
  Descripción: Tipo de actividad
  Pregunta: El mes pasado, ¿a qué se dedicó su empresa o negocio?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '4': Actividades agrícolas
    '5': Actividades de cría y explotación de animales
    '6': Actividades de recolección
    '7': Reforestación y tala de arboles
    '8': Actividades de caza y captura de animales
    '9': Actividades de pesca
cose_cria:
  Descripción: Cosecha o cría
  Pregunta: ¿Sembró o cosechó algún producto agrícola? ¿Crió o explotó animales? ¿Cazó o capturó animales?
    ¿Pescó animales? ¿Recolectó productos?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
prep_deriv:
  Descripción: Preparación o derivados
  Pregunta: ¿Preparó las tierras para el cultivo? ¿Obtuvo algún producto derivado de sus animales?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
valproc:
  Descripción: Valor de productos en proceso
  Pregunta: ¿Cuál es el valor de los cultivos o productos que se encontraban en crecimiento o desarrollo
    el último día del mes pasado? ¿Cuál es el valor de los productos o de los animales que se encontraban
    en crecimiento o desarrollo el último día del mes pasado?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
valrema:
  Descripción: Valor de productos en remanente
  Pregunta: ¿Cuál es el valor de los cultivos o productos que le quedaron y que aún no determina su uso?
    ¿Cuál es el valor en el mercado de los animales y/o productos que le quedaron y que aún no determina
    su uso?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
apoyo:
  Descripción: Apoyo para los negocios
