ID_VIV:
  Descripción: Identificador único de la vivienda (2015, 2020 y 2025 — 12 dígitos; los dos primeros son
    la entidad, así que es único en todo el país). Los CSV de 2015 lo escriben sin el cero inicial de
    las entidades 01-09 (11 dígitos); harmonize=True lo rellena. En 2010 es un consecutivo de 8 dígitos
    único sólo dentro de la entidad; harmonize=True le antepone la entidad (entidad + consecutivo a 10
    dígitos). 2000 y 2005 no lo traen; se deriva de las partes de la clave — 2000, ENT + MUN + LOC + NUMVIV
