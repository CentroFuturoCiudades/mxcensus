CVEGEO:
  Descripción: Clave geoestadística integrada. Microdatos — entidad + municipio (5 dígitos); estimaciones
    — entidad + municipio + localidad (9 dígitos), con 00/000/0000 para los totales nacional, estatal
    y municipal.
  Tipo: string
  Longitud: 5 / 9
CVE_ENT:
  Descripción: Clave del Área Geoestadística Estatal (01-32; 00 = total nacional en las estimaciones)
  Tipo: string
  Longitud: '2'
NOM_ENT:
  Descripción: Nombre del Área Geoestadística Estatal
  Definición: Nombre oficial de la entidad federativa
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
CVE_MUN:
  Descripción: Clave del Área Geoestadística Municipal (001-570; en las estimaciones 000 = total estatal
    y 997 = localidades de menos de 50 000 habitantes de la entidad)
  Tipo: string
  Longitud: '3'
NOM_MUN:
  Descripción: Nombre del Área Geoestadística Municipal
  Definición: Nombre oficial del municipio o demarcación territorial en el caso de la Ciudad de México
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
CVE_LOC:
  Descripción: Clave de la localidad de 50 000 y más habitantes (estimaciones); 0000 = total del municipio,
    9997 = localidades de menos de 50 000 habitantes de la entidad
  Tipo: string
  Longitud: '4'
NOM_LOC:
  Descripción: Nombre de la localidad de 50 000 y más habitantes
  Definición: Nombre con el que se reconoce a la localidad dado por la ley o la costumbre
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
ESTIMADOR:
  Descripción: Tipo de estimador de cada renglón de las estimaciones (cinco renglones por área geográfica;
    los límites de confianza son al 90 por ciento)
  Tipo: categorical
  Longitud: '50'
  Categorías:
    Valor: Valor
    Error estándar: Error estándar
    Límite inferior de confianza: Límite inferior de confianza
    Límite superior de confianza: Límite superior de confianza
    Coeficiente de variación: Coeficiente de variación
POBTOT:
  Descripción: Población en viviendas particulares habitadas
  Definición: Total de personas que residen habitualmente en el país, la entidad federativa, el municipio
    o la demarcación territorial y la localidad de 50 000 y más habitantes. Incluye a la población que
    no especificó su edad
  Tipo: numeric
  Longitud: '9'
  Rangos: 0 … 999999999
  Categorías: {}
  Especiales:
    NA: No aplica
    MI: No disponible por muestra insuficiente
POBFEM:
  Descripción: Mujeres
  Definición: Total de mujeres que residen habitualmente en el país, la entidad federativa, el municipio
    o la demarcación territorial y la localidad de 50 000 y más habitantes. Incluye a la población que
