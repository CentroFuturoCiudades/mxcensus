TIPO_OPE:
  Descripción: Tipo de operativo
  Definición: Distingue a las viviendas según si se captaron en un operativo normal o especial.
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': Viviendas particulares sin segmentar, operativo normal
    '1': Viviendas particulares con manzana segmentada, operativo normal
    '2': Viviendas particulares de personalidades, operativo especial
    '3': Viviendas particulares del Servicio Exterior Mexicano, operativo especial
    '4': Viviendas particulares al interior de colectivas, operativo especial
    '5': Viviendas particulares cuya información fue proporcionada por un vecino, operativo normal, etapa
      de recuperación
    '6': Viviendas particulares reportadas como pendientes, operativo normal, etapa de cierre de campo
    '7': Personas sin vivienda, indigentes, operativo especial
    '8': Viviendas colectivas, operativo especial
