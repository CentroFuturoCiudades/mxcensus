DIS_AGUA:
  Descripción: Disponibilidad de agua
  Definición: Distingue si la vivienda tiene o no agua y la forma de abastecimiento.
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Disponen de agua de la red pública dentro de la vivienda
    '2': Disponen de agua de la red pública fuera de la vivienda pero dentro del terreno
    '3': Se abastecen de una llave pública o hidrante
    '4': Se abastecen de otra vivienda
    '5': Se abastecen de agua de pipa
    '6': Se abastecen de agua de pozo
    '7': Se abastecen de agua de río, arroyo, lago u otro
  Especiales:
    '9': No especificado
  Catálogo: TC_DAGUA
DIS_SANI:
  Descripción: Disponibilidad de sanitario
  Definición: Distingue si la vivienda tiene o no servicio sanitario.
