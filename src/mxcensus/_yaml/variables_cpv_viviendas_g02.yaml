    '1': Si
    '2': 'No'
  Especiales:
    '9': No especificado
  Catálogo: TC_RESINV
CON_AGUA:
  Descripción: Conexión de agua
  Definición: De las viviendas que disponen de servicio sanitario, identifica aquellas donde el servicio
    tiene conexión de agua o si le echan agua con cubeta o si no se le puede echar agua o bien si no especificó
    esta condición.
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '3': Tiene conexión de agua
    '4': Le echan agua con cubeta
    '5': No se le puede echar agua
  Especiales:
    '9': No especificado
  Catálogo: TC_CAGUA
