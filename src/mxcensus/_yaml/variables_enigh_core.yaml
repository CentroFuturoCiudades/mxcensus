# Hand-curated ENIGH analytical-core dictionary (canonical / nueva-serie names).
#
# Read (never written) by `scripts/build_enigh.py --variables`, which overlays these entries
# onto the per-group `variables_enigh_{table}_{gNN}.yaml` (generated from INEGI's DDI
# metadata + the data), and by `mxcensus.enigh` for the harmonized schema
# (`_latest_schema`) and the core column order. Entry contract: see the header of
# variables_enoe_core.yaml (Descripción / Pregunta / Tipo / Longitud / Categorías /
# Especiales / Ordenada / Rango / Alias / Decimales).
#
# Labels from INEGI's DDI codebooks (https://www.inegi.org.mx/rnm/index.php/catalog/1116,
# ENIGH 2024) and the "Descripción de la base de datos". `Categorías` keys are the
# canonical (zero-padded) spellings; `educa_jefe` is un-padded in 2012, so its `Alias`
# folds those spellings onto the canonical codes (harmonization pads it as well).
#
# 2008/2010 (NCV) spell several of these differently in `concentradohogar` (`ingcor`,
# `tam_hog`, `sexo`/`edad`/`ed_formal` for the head, `n_ocup`/`pering`/`perocu`); the
# harmonization rename map in `enigh.py` folds them onto the names below.

folioviv:
  Descripción: Identificador de la vivienda (folio). Los dos primeros caracteres son la clave de la entidad federativa.
  Tipo: string
  Longitud: "6 (2008–2012) / 10 (2014+)"
  Categorías: {}
foliohog:
  Descripción: Identificador del hogar dentro de la vivienda.
  Tipo: string
  Longitud: "1"
  Categorías: {}
numren:
  Descripción: Número de renglón (identificador de la persona dentro del hogar).
  Tipo: string
  Longitud: "2"
  Categorías: {}
ubica_geo:
  Descripción: Ubicación geográfica — clave de entidad (2) + municipio (3) [+ localidad (4) en 2012–2022].
  Tipo: string
  Longitud: "5 / 9"
  Categorías: {}
tam_loc:
  Descripción: Tamaño de localidad.
  Tipo: categorical
  Longitud: "1"
  Ordenada: true
  Categorías:
    '4': Localidades con menos de 2 500 habitantes
    '3': Localidades con 2 500 a 14 999 habitantes
    '2': Localidades con 15 000 a 99 999 habitantes
    '1': Localidades con 100 000 y más habitantes
est_socio:
  Descripción: Estrato socioeconómico (2012+).
  Tipo: categorical
  Longitud: "1"
  Ordenada: true
  Categorías:
    '1': Bajo
    '2': Medio bajo
    '3': Medio alto
    '4': Alto
est_dis:
  Descripción: Estrato de diseño muestral.
  Tipo: string
  Longitud: "3"
  Categorías: {}
upm:
  Descripción: Unidad primaria de muestreo.
  Tipo: string
  Longitud: "4"
  Categorías: {}
factor:
  Descripción: Factor de expansión (de vivienda/hogar según la tabla; `factor_hog`/`factor_viv` en 2012–2014).
  Tipo: numeric
  Longitud: ""
  Categorías: {}
clase_hog:
  Descripción: Clase de hogar.
  Tipo: categorical
  Longitud: "1"
  Categorías:
    '1': Unipersonal
    '2': Nuclear
    '3': Ampliado
    '4': Compuesto
    '5': De corresidentes
sexo_jefe:
  Descripción: Sexo de la jefa o jefe del hogar.
  Tipo: categorical
  Longitud: "1"
  Categorías:
    '1': Hombre
    '2': Mujer
edad_jefe:
  Descripción: Edad de la jefa o jefe del hogar (años cumplidos).
  Tipo: numeric
  Longitud: "3"
  Rango: [0, 120]
  Categorías: {}
educa_jefe:
  Descripción: Nivel de escolaridad de la jefa o jefe del hogar.
  Tipo: categorical
  Longitud: "2"
  Ordenada: true
  Categorías:
    '01': Sin instrucción
    '02': Preescolar
    '03': Primaria incompleta
    '04': Primaria completa
    '05': Secundaria incompleta
    '06': Secundaria completa
    '07': Preparatoria incompleta
    '08': Preparatoria completa
    '09': Profesional incompleta
    '10': Profesional completa
    '11': Posgrado
  Alias:
    '1': '01'
    '2': '02'
    '3': '03'
    '4': '04'
    '5': '05'
    '6': '06'
    '7': '07'
    '8': '08'
    '9': '09'
tot_integ:
  Descripción: Total de integrantes del hogar.
  Tipo: numeric
  Longitud: "2"
  Rango: [1, 60]
  Categorías: {}
ocupados:
  Descripción: Integrantes ocupados del hogar.
  Tipo: numeric
  Longitud: "2"
  Rango: [0, 60]
  Categorías: {}
percep_ing:
  Descripción: Perceptores de ingreso en el hogar.
  Tipo: numeric
  Longitud: "2"
  Rango: [0, 60]
  Categorías: {}
perc_ocupa:
  Descripción: Perceptores de ingreso ocupados en el hogar.
  Tipo: numeric
  Longitud: "2"
  Rango: [0, 60]
  Categorías: {}
ing_cor:
  Descripción: Ingreso corriente total trimestral del hogar (monetario + no monetario).
  Tipo: numeric
  Longitud: "12"
  Decimales: "2"
  Rango: [0, 1000000000]
  Categorías: {}
ingtrab:
  Descripción: Ingreso trimestral por trabajo.
  Tipo: numeric
  Longitud: "12"
  Decimales: "2"
  Rango: [0, 1000000000]
  Categorías: {}
gasto_mon:
  Descripción: Gasto corriente monetario trimestral del hogar.
  Tipo: numeric
  Longitud: "12"
  Decimales: "2"
  Rango: [0, 1000000000]
  Categorías: {}
sexo:
  Descripción: Sexo (tabla poblacion).
  Tipo: categorical
  Longitud: "1"
  Categorías:
    '1': Hombre
    '2': Mujer
edad:
  Descripción: Edad en años cumplidos (tabla poblacion).
  Tipo: numeric
  Longitud: "3"
  Rango: [0, 120]
  Categorías: {}
parentesco:
  Descripción: Parentesco con la jefa o jefe del hogar (código de 3 dígitos; clasificador INEGI — etiquetas en el diccionario por grupo).
  Tipo: string
  Longitud: "3"
  Categorías: {}
