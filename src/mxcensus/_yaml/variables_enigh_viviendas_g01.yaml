folioviv:
  Descripción: Identificador de la vivienda (folio). Los dos primeros caracteres son la clave de la entidad
    federativa.
  Tipo: string
  Longitud: 6 (2008–2012) / 10 (2014+)
  Categorías: {}
tipo_viv:
  Descripción: Tipo de vivienda
  Pregunta: 'Esta vivienda es:'
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Casa independiente
    '2': Departamento en edificio
    '3': Vivienda en vecindad
    '4': Vivienda en cuarto de azotea
    '5': Local no construido para habitación
  Especiales:
    '&': No especificado
mat_pared:
  Descripción: Material de paredes
  Pregunta: ¿De qué material es la mayor parte de las paredes o muros de esta vivienda?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Material de desecho
    '2': Lamina de cartón
    '3': Lámina de asbesto o metálica
    '4': Carrizo bambú o palma
    '5': Embarro o Bajareque
    '6': Madera
    '7': Adobe
    '8': Tabique, block, piedra, cantera, cemento o concreto
mat_techos:
  Descripción: Material de techos
  Pregunta: ¿De qué material es la mayor parte del techo de esta vivienda?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Material de desecho
    '2': Lámina de cartón
    '3': Lámina metálica
    '4': Lámina de asbesto
    '5': Palma o paja
    '6': Madera o tejamanil
    '7': Terrado con viguería
    '8': Teja
    '9': Losa de concreto o viguetas con bovedilla
mat_pisos:
  Descripción: Material de pisos
  Pregunta: ¿De qué material es la mayor parte del piso de esta vivienda?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Tierra
    '2': Cemento o firme
    '3': Madera, mosaico u otro recubrimiento
  Especiales:
    '&': No especificado
antiguedad:
  Descripción: Antigüedad de la vivienda
  Pregunta: ¿Cuánto años hace que se construyó esta vivienda?
  Tipo: numeric
  Longitud: '2'
  Categorías: {}
antigua_ne:
  Descripción: Antigüedad no especificada de la vivienda
  Pregunta: ¿Cuánto años hace que se construyó esta vivienda?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': No sabe
cocina:
  Descripción: Tiene cocina
  Pregunta: ¿Esta vivienda tiene un cuarto para cocinar?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
cocina_dor:
  Descripción: Utiliza cocina de dormitorio
  Pregunta: ¿En el cuarto donde cocinan también duermen?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
cuart_dorm:
  Descripción: Cuartos dormitorio
  Pregunta: ¿Cuántos cuartos se usan para dormir sin contar pasillos ni baños?
  Tipo: numeric
  Longitud: '2'
  Categorías: {}
num_cuarto:
  Descripción: Número de cuartos
  Pregunta: ¿Cuántos cuartos tiene en total esta vivienda contando la cocina? (no cuente ni pasillos ni
    baños)
  Tipo: numeric
  Longitud: '2'
  Categorías: {}
disp_agua:
  Descripción: Disponibilidad de agua
  Pregunta: ¿En esta vivienda tienen,...,.
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Agua entubada dentro de la vivienda
    '2': Agua entubada fuera de la vivienda, pero dentro del terreno
    '3': Agua entubada de llave pública (o hidrante)
    '4': Agua entubada que acarrean de otra vivienda
    '5': Agua de pipa
    '6': Agua de un pozo, río, lago, arroyo u otra
dotac_agua:
  Descripción: Dotación de agua
  Pregunta: ¿Cuántos días a la semana llega el agua a esta vivienda?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Diario
    '2': Cada tercer día
    '3': Dos veces por semana
    '4': Una vez por semana
    '5': De vez en cuando
  Especiales:
    '&': No especificado
excusado:
  Descripción: Tiene excusado
  Pregunta: ¿Tienen excusado, retrete, sanitario, letrina u hoyo negro?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
uso_compar:
  Descripción: Uso compartido del sanitario
  Pregunta: ¿El servicio sanitario lo comparten con otra vivienda?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
sanit_agua:
  Descripción: Sanitario conexión agua
  Pregunta: ¿El servicio sanitario…
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Tiene descarga directa de agua
    '2': Le echan agua con cubeta
    '3': No se le puede echar agua
  Especiales:
    '&': No especificado
drenaje:
  Descripción: Destino del drenaje
  Pregunta: ¿Esta vivienda tiene drenaje o desagüe conectado a…
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': La red pública
    '2': Una fosa séptica
    '3': Una tubería que va a dar a una barranca o grieta
    '4': Una tubería que va a dar a un río, lago o mar
    '5': No tiene drenaje
disp_elect:
  Descripción: Disponibilidad eléctrica
  Pregunta: ¿En esta vivienda la luz eléctrica la obtienen…
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Del servicio público
    '2': De una planta particular
    '3': De panel solar
    '4': De otra fuente
    '5': No tiene luz eléctrica
num_focos:
  Descripción: Número de focos
  Pregunta: ¿Cuántos focos tiene esta vivienda?
  Tipo: numeric
  Longitud: '2'
  Categorías: {}
combustible:
  Descripción: Tipo de combustible
  Pregunta: ¿El combustible que más usan para cocinar es…
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Leña
    '2': Carbón
    '3': Gas de tanque
    '4': Gas natural o de tubería
    '5': Electricidad
    '6': Otro combustible
  Especiales:
    '&': No especificado
estufa_chi:
  Descripción: Estufa con chimenea
  Pregunta: ¿La estufa (fogón) de leña o carbón con la que cocinan tiene chimenea?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
eli_basura:
  Descripción: Eliminación de basura
  Pregunta: ¿La basura de esta vivienda…
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': La recoge un camión o carrito de basura
    '2': La tiran en el basurero público
    '3': La tiran a un contenedor o depósito
    '4': La queman
    '5': La entierran
    '6': La tiran en un terreno baldío o calle
    '7': La tiran en la barranca o grieta
    '8': La tiran al río, lago o mar
tenencia:
  Descripción: Tipo de tenencia de la vivienda
  Pregunta: ¿Esta vivienda…
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Es rentada
    '2': Es prestada
    '3': Es propia pero la están pagando
    '4': Es propia
    '5': Está intestada o en litigio
    '6': Otra situación
num_dueno1:
  Descripción: Identificador del primer dueño
  Pregunta: ¿Quién de las personas que viven aquí es el dueño o dueña de esta vivienda?
