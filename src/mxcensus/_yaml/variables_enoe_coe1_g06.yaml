  Tipo: string
  Longitud: '5'
  Categorías: {}
upm:
  Descripción: Unidad primaria de muestreo
  Pregunta: No existe pregunta, es un identificador de la vivienda.
  Tipo: string
  Longitud: '7'
  Categorías: {}
d_sem:
  Descripción: Distribución semanal
  Pregunta: No existe pregunta, es un identificador de la vivienda.
  Tipo: numeric
  Longitud: '3'
  Categorías: {}
n_pro_viv:
  Descripción: Número progresivo de la vivienda
