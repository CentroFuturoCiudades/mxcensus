  Longitud: '1'
  Categorías: {}
n_ent:
  Descripción: Número de entrevista o visita a la vivienda (1-5 en el panel de cinco visitas; valores
    mayores — hasta 17 y más — en la ENOE-N/CATI de 2020-T3 a 2021-T2, no documentados en la FD)
  Tipo: numeric
  Longitud: '2'
  Rango:
  - 1
  - 99
  Categorías: {}
per:
  Descripción: Periodo — trimestre (primer dígito 1-4) y año (dos dígitos), p. ej. '123' = 2023-T1
