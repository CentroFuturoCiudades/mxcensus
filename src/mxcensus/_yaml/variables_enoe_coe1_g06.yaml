  Longitud: '3'
  Categorías: {}
n_ren:
  Descripción: Número de renglón del integrante del hogar
  Tipo: string
  Longitud: '2'
  Categorías: {}
eda:
  Descripción: Edad en años cumplidos (filtro analítico EDA in [15, 98]); 0 = menores de 1 año, 97 = 97
