folioviv:
  Descripción: Identificador de la vivienda (folio). Los dos primeros caracteres son la clave de la entidad
    federativa.
  Tipo: string
  Longitud: 6 (2008–2012) / 10 (2014+)
  Categorías: {}
foliohog:
  Descripción: Identificador del hogar dentro de la vivienda.
  Tipo: string
  Longitud: '1'
  Categorías: {}
clave:
  Descripción: Identificador del producto, artículo o servicio
  Pregunta: ''
  Tipo: string
  Longitud: '4'
  Categorías: {}
  Nota: catálogo de 471 códigos (no enumerado)
costo:
  Descripción: Costo de los productos, artículos y servicios
  Pregunta: ¿Cuál fue el precio acordado o pactado?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
lug_com:
  Descripción: Lugar de compra
  Pregunta: ¿Dónde compró este artículo?
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '1': Mercado
    '2': Tianguis o mercado sobre ruedas
    '3': Vendedores ambulantes
    '4': Tiendas de abarrotes
    '5': Tiendas específicas del ramo
    '6': Supermercados
    '7': Tiendas departamentales
    '8': Compras fuera del país
    '9': Tiendas con membresía
    '10': Tiendas de conveniencia
    '15': Otros
inst1:
  Descripción: Código de la institución
  Pregunta: ¿En dónde recibió el servicio y/o los productos?
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '0': No tiene institucion
    '1': Médicos, laboratorios y hospitales particulares
    '2': Servicios médicos del IMMS
    '7': Servicios médicos de la SSA
    '8': Servicios médicos del DIF
    '9': Servicios médicos de Universidades públicas
    '10': Otros servicios médicos. Cruz Roja, Cruz Verde, etc.
inst2:
  Descripción: Código de la institución
  Pregunta: ¿En dónde recibió el servicio y/o los productos?
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '0': No tiene institucion
    '1': Médicos, laboratorios y hospitales particulares
    '2': Servicios médicos del IMMS
    '7': Servicios médicos de la SSA
    '8': Servicios médicos del DIF
    '9': Servicios médicos de Universidades públicas
    '10': Otros servicios médicos. Cruz Roja, Cruz Verde, etc.
fpago:
  Descripción: Forma de pago
  Pregunta: Este artículo ¿lo pagó…?
  Tipo: categorical
  Longitud: '3'
  Categorías:
    '1': De contado
    '2': Con tarjeta de crédito bancaria o comercial
    '3': Fiado (persona particular o establecimiento comercial)
    '12': De contado y con tarjeta de crédito bancaria o comercial
    '13': De contado y fiado (persona particular o establecimiento comercial)
    '21': Con tarjeta de crédito bancaria o comercial y de contado
    '23': Con tarjeta de crédito bancaria o comercial y fiado (persona particular o establecimiento comercial)
    '31': Fiado (persona particular o establecimiento comercial) y de contado
    '32': Fiado (persona particular o establecimiento comercial) y con tarjeta de crédito bancaria o comercial
    '132': De contado, fiado (persona particular o establecimiento comercial) y con tarjeta de crédito
      bancaria o comercial
enganche:
  Descripción: Enganche y abonos
  Pregunta: ¿Cuánto pagó de enganche y abonos?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
contado:
  Descripción: Contado
  Pregunta: ¿Cuánto pagó de contado?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
gasto:
  Descripción: Gasto efectuado
  Pregunta: ¿Cuánto pagó el mes pasado?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
pago_mp:
  Descripción: Pago en el mes pasado
  Pregunta: ¿Cuánto pagó el mes pasado?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
inmujer:
  Descripción: Gasto en mujeres
  Pregunta: ¿Cuánto gastó para mujeres y niñas?
  Tipo: numeric
  Longitud: '9'
  Categorías: {}
  Especiales:
    '-1': No especificado
gas_tri:
  Descripción: Gasto trimestral
  Pregunta: ''
  Tipo: numeric
  Longitud: '10'
  Categorías: {}
