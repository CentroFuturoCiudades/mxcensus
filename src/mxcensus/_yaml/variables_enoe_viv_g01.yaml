t_loc:
  Descripción: Tamaño de localidad (ediciones anteriores a 2020-T3)
  Tipo: categorical
  Longitud: '1'
  Ordenada: true
  Categorías:
    '4': Localidades menores de 2 500 habitantes
    '3': Localidades de 2 500 a 14 999 habitantes
    '2': Localidades de 15 000 a 99 999 habitantes
    '1': Localidades mayores de 100 000 habitantes
  Especiales:
    '0': No especificado (código no documentado en la FD)
