  Tipo: numeric
  Longitud: '2'
  Rango:
  - 1
  - 99
  Categorías: {}
per:
  Descripción: Periodo — trimestre (primer dígito 1-4) y año (dos dígitos), p. ej. '123' = 2023-T1
  Tipo: string
  Longitud: '3'
  Categorías: {}
p1:
  Descripción: Personas que viven en la vivienda
  Pregunta: ¿Cuántas personas viven normalmente en esta vivienda contando a los niños chiquitos y a los
    ancianos?
  Tipo: numeric
  Longitud: '2'
  Categorías: {}
  Nota: 'numérica: el DDI sólo enumera códigos especiales'
p2:
  Descripción: Comparten un mismo gasto
  Pregunta: ¿Todas estas personas comparten un mismo gasto para comer?
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí
    '2': 'No'
p3:
  Descripción: Grupos con gastos separados
  Pregunta: ¿Cuántos hogares o grupos de personas tienen gastos separados para comer contando el de usted?
  Tipo: numeric
  Longitud: '2'
  Categorías: {}
  Nota: 'numérica: el DDI sólo enumera códigos especiales'
ur:
  Descripción: Variable de apoyo
  Pregunta: Variable de apoyo
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Urbano
    '2': Rural
fac:
  Descripción: Factor de expansión (ponderador; ediciones anteriores a 2020-T3)
  Tipo: numeric
  Longitud: '6'
  Categorías: {}
