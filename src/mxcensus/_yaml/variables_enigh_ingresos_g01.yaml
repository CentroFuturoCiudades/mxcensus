folioviv:
  Descripción: Identificador de la vivienda (folio). Los dos primeros caracteres son la clave de la entidad
    federativa.
  Tipo: string
  Longitud: 6 (2008–2012) / 10 (2014+)
  Categorías: {}
foliohog:
  Descripción: Identificador del hogar dentro de la vivienda.
  Tipo: string
  Longitud: '1'
  Categorías: {}
numren:
  Descripción: Número de renglón (identificador de la persona dentro del hogar).
  Tipo: string
  Longitud: '2'
  Categorías: {}
clave:
  Descripción: Claves de ingreso
  Pregunta: CLAVE
  Tipo: string
  Longitud: '4'
  Categorías: {}
  Nota: catálogo de 87 códigos (no enumerado)
mes_1:
  Descripción: Primer mes
  Pregunta: MES PASADO
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '07': Julio
    08: Agosto
    09: Septiembre
    '10': Octubre
    '11': '11'
    '7': '7'
    '8': '8'
    '9': '9'
  Nota: 'códigos observados sin etiqueta en el DDI: [''11'', ''7'', ''8'', ''9'']'
