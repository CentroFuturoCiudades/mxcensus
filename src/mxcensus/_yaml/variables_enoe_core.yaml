# ENOE analytical-core variable dictionary (hand-curated).
#
# Authoritative entries for the variables that matter for labor-force analysis: the person
# key, the canonical-universe filter columns, the expansion weights, the main demographic
# items and the precodificado (pre-classified) analytical variables in SDEM. Unlike the
# per-group files (variables_enoe_{table}_{gNN}.yaml — generated by build_enoe.py
# --variables from INEGI's DDI metadata + the data), this file is maintained by hand and
# takes precedence over them: it fixes category *order* (ordinal scales), numeric ranges
# and sentinel codes, and the harmonized analytical meaning of each field.
#
# Entry contract (shared with the ENIGH core and the generated files; read by
# mxcensus._schema_groups):
#   Descripción  human-readable label            Pregunta   question text (optional)
#   Tipo         categorical | numeric | string  Longitud   field width (informative)
#   Categorías   {code: label} — a non-empty map makes the variable categorical; keys use
#                the spelling found in the CSV (mes_cal is un-padded, cs_p13_1 is padded)
#   Especiales   {code: label} sentinel codes: extra categories for a categorical (they are
#                information — "No especificado"), NA for a numeric
#   Ordenada     true → ordered categorical, in the order the categories are listed
#   Rango        [min, max] inclusive bounds checked on a numeric column
#   Alias        {raw spelling: canonical code} applied before labelling
#   Decimales    non-empty → float column, otherwise integer
#
# Source: INEGI's DDI codebooks in the Red Nacional de Metadatos (e.g. ENOE 2023,
#   https://www.inegi.org.mx/rnm/index.php/catalog/866) and the FD "Estructura de la base
#   de datos". Mnemonics are lowercase to match the CSV column names in every regime.
#
# Analytical universe: a precodificado variable is only meaningful where R_DEF == '00'
#   AND C_RES in {1, 3} AND EDA in [15, 98]. Records outside it carry the fill code '0'
#   ("No aplica"), listed as a category so it is labelled rather than rejected.

# --- person key (cd_a+ent+con+v_sel+n_hog+h_mud+n_ren [+tipo+mes_cal from 2020-T3]) ----
cd_a:
  Descripción: Ciudad autorrepresentada (agrupación de áreas de la muestra)
  Tipo: string
  Longitud: '2'
  Categorías: {}
ent:
  Descripción: Entidad federativa (01-32)
  Tipo: string
  Longitud: '2'
  Categorías: {}
con:
  Descripción: Número de control de la vivienda
  Tipo: string
  Longitud: '5'
  Categorías: {}
v_sel:
  Descripción: Vivienda seleccionada
  Tipo: string
  Longitud: '2'
  Categorías: {}
n_hog:
  Descripción: Número de hogar
  Tipo: string
  Longitud: '1'
  Categorías: {}
h_mud:
  Descripción: Hogar mudado (número de veces que el hogar se ha mudado)
  Tipo: string
  Longitud: '1'
  Categorías: {}
n_ren:
  Descripción: Número de renglón del integrante del hogar
  Tipo: string
  Longitud: '2'
  Categorías: {}
tipo:
  Descripción: Tipo de muestra (presente desde 2020-T3)
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': ENOE
    '2': ENOE-CATI
mes_cal:
  Descripción: Mes calendario — clasificación mensual del registro; base del ponderador
    mensual FAC_MEN (presente desde 2020-T3). Los códigos de mes se emiten sin cero a la
    izquierda en el CSV (1-12). Códigos especiales 96-99 por trimestre (Q1=96, Q2=97,
    Q3=98, Q4=99) — registros sin mes calendario específico.
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '1': Enero
    '2': Febrero
    '3': Marzo
    '4': Abril
    '5': Mayo
    '6': Junio
    '7': Julio
    '8': Agosto
    '9': Septiembre
    '10': Octubre
    '11': Noviembre
    '12': Diciembre
    '96': Sin mes calendario específico (trimestre 1)
    '97': Sin mes calendario específico (trimestre 2)
    '98': Sin mes calendario específico (trimestre 3)
    '99': Sin mes calendario específico (trimestre 4)

# --- canonical-universe filter columns -------------------------------------------------
r_def:
  Descripción: Resultado definitivo de la entrevista (filtro analítico R_DEF == '00';
    códigos 00-15, sin cero a la izquierda en el CSV)
  Tipo: string
  Longitud: '2'
  Categorías: {}
c_res:
  Descripción: Condición de residencia (filtro analítico C_RES in {1, 3})
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Residente habitual
    '2': Ausente definitivo
    '3': Nuevo residente
eda:
  Descripción: Edad en años cumplidos (filtro analítico EDA in [15, 98]); 0 = menores de
    1 año, 97 = 97 años y más
  Tipo: numeric
  Longitud: '2'
  Rango: [0, 97]
  Especiales:
    '98': No especificada (12 años y más)
    '99': No especificada (0 a 11 años)
  Categorías: {}

# --- expansion weights -----------------------------------------------------------------
fac:
  Descripción: Factor de expansión (ponderador; ediciones anteriores a 2020-T3)
  Tipo: numeric
  Longitud: '6'
  Categorías: {}
fac_tri:
  Descripción: Ponderador trimestral — permite obtener los resultados trimestrales
    (desde 2020-T3)
  Tipo: numeric
  Longitud: '6'
  Categorías: {}
fac_men:
  Descripción: Ponderador mensual — resultados mensuales con base en el campo MES_CAL
    (desde 2020-T3)
  Tipo: numeric
  Longitud: '6'
  Categorías: {}

# --- demographics (SDEM) ---------------------------------------------------------------
sex:
  Descripción: Sexo
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Hombre
    '2': Mujer
e_con:
  Descripción: Estado conyugal
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Vive con su pareja en unión libre
    '2': Está separado(a)
    '3': Está divorciado(a)
    '4': Está viudo(a)
    '5': Está casado(a)
    '6': Está soltero(a)
  Especiales:
    '9': No sabe
niv_ins:
  Descripción: Nivel de instrucción (población de 5 años y más)
  Tipo: categorical
  Longitud: '1'
  Ordenada: true
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '1': Primaria incompleta
    '2': Primaria completa
    '3': Secundaria completa
    '4': Medio superior y superior
  Especiales:
    '5': No especificado
anios_esc:
  Descripción: Años de escolaridad
  Tipo: numeric
  Longitud: '2'
  Rango: [0, 24]
  Especiales:
    '99': No especificado
  Categorías: {}

# --- precodificado analytical variables (SDEM) -----------------------------------------
clase1:
  Descripción: Clasificación de la población en PEA y PNEA
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '1': Población económicamente activa (PEA)
    '2': Población no económicamente activa (PNEA)
clase2:
  Descripción: Clasificación de la población ocupada y desocupada; disponible y no
    disponible
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '1': Población ocupada
    '2': Población desocupada
    '3': Disponible
    '4': No disponible
pos_ocu:
  Descripción: Clasificación de la población ocupada por posición en la ocupación
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '1': Trabajadores subordinados y remunerados
    '2': Empleadores
    '3': Trabajadores por cuenta propia
    '4': Trabajadores sin pago
  Especiales:
    '5': No especificado
rama_est1:
  Descripción: Clasificación de la población ocupada según sector de actividad (totales)
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '1': Primario
    '2': Secundario
    '3': Terciario
  Especiales:
    '4': No especificado
rama_est2:
  Descripción: Clasificación de la población ocupada según sector de actividad (subtotales)
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '1': Agricultura, ganadería, silvicultura, caza y pesca
    '2': Industria extractiva y de la electricidad
    '3': Industria manufacturera
    '4': Construcción
    '5': Comercio
    '6': Restaurantes y servicios de alojamiento
    '7': Transportes, comunicaciones, correo y almacenamiento
    '8': Servicios profesionales, financieros y corporativos
    '9': Servicios sociales
    '10': Servicios diversos
    '11': Gobierno y organismos internacionales
emp_ppal:
  Descripción: Clasificación de empleos formales e informales de la primera actividad
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '1': Empleo informal
    '2': Empleo formal
ing7c:
  Descripción: Clasificación de la población ocupada por nivel de ingreso (salarios mínimos)
  Tipo: categorical
  Longitud: '1'
  Ordenada: true
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '6': No recibe ingresos
    '1': Hasta un salario mínimo
    '2': Más de 1 hasta 2 salarios mínimos
    '3': Más de 2 hasta 3 salarios mínimos
    '4': Más de 3 hasta 5 salarios mínimos
    '5': Más de 5 salarios mínimos
  Especiales:
    '7': No especificado
seg_soc:
  Descripción: Clasificación de la población ocupada por condición de acceso a
    instituciones de salud
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '1': Con acceso
    '2': Sin acceso
  Especiales:
    '3': No especificado
c_ocu11c:
  Descripción: Clasificación de la población ocupada por condición de ocupación
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '0': No aplica (fuera del universo analítico)
    '1': Profesionales, técnicos y trabajadores del arte
    '2': Trabajadores de la educación
    '3': Funcionarios y directivos
    '4': Oficinistas
    '5': Trabajadores industriales, artesanos y ayudantes
    '6': Comerciantes
    '7': Operadores de transporte
    '8': Trabajadores en servicios personales
    '9': Trabajadores en protección y vigilancia
    '10': Trabajadores agropecuarios
  Especiales:
    '11': No especificado
hrsocup:
  Descripción: Horas trabajadas en la semana (población ocupada; 0 fuera del universo)
  Tipo: numeric
  Longitud: '3'
  Rango: [0, 168]
  Categorías: {}
ingocup:
  Descripción: Ingreso mensual de la población ocupada (pesos corrientes; 0 fuera del
    universo o sin ingresos)
  Tipo: numeric
  Longitud: '6'
  Rango: [0, 999999]
  Categorías: {}
