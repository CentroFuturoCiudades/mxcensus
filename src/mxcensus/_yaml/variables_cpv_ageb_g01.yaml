ENTIDAD:
  Descripción: Clave de entidad federativa
  Definición: Código que identifica a la entidad federativa. El código 00 identifica a los registros con
    los totales a nivel nacional.
  Tipo: string
  Longitud: '2'
  Rangos: 00…32
NOM_ENT:
  Descripción: Entidad federativa
  Definición: Nombre oficial de la entidad federativa.
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
MUN:
  Descripción: Clave de municipio o demarcación territorial
  Definición: Código que identifica al municipio o demarcación territorial al interior de una entidad
    federativa, conforme al Marco Geoestadístico. El código 000 identifica a los registros con los totales
    a nivel de entidad federativa.
  Tipo: string
  Longitud: '3'
  Rangos: 000…570
NOM_MUN:
  Descripción: Municipio o demarcación territorial
  Definición: Nombre oficial del municipio o demarcación territorial en el caso de la Ciudad de México.
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
LOC:
  Descripción: Clave de localidad
  Definición: Código que identifica a la localidad al interior de cada municipio o demarcación territorial
    conforme al Marco Geoestadístico. El código 0000 identifica a los registros con los totales a nivel
    de municipio o demarcación territorial.
  Tipo: string
  Longitud: '4'
  Rangos: 0000…9999
NOM_LOC:
  Descripción: Localidad
  Definición: Nombre con el que se reconoce a la localidad dado por la ley o la costumbre.
  Tipo: string
  Longitud: '70'
  Rangos: Alfanumérico
AGEB:
  Descripción: Clave del AGEB
  Definición: Clave que identifica al AGEB urbana, al interior de una localidad, de acuerdo con la desagregación
    del Marco Geoestadístico.
  Tipo: string
  Longitud: '4'
  Rangos: 001...999; 0...9 o A-P
MZA:
  Descripción: Clave de manzana
  Definición: Clave que identifica a la manzana, al interior de una AGEB, de acuerdo a la desagregación
    del Marco Geoestadístico.
  Tipo: string
  Longitud: '3'
  Rangos: 001...999
POBTOT:
  Descripción: Población total
  Definición: Total de personas que residen habitualmente en el país, la entidad federativa, el municipio
    o la demarcación territorial y la localidad. Incluye la estimación del número de personas en viviendas
    particulares sin información de ocupantes. Incluye a la población que no especificó su edad.
  Tipo: numeric
  Longitud: '9'
  Rangos: 0...999999999
  Categorías: {}
  Especiales:
    '*': Dato reservado por confidencialidad
    N/D: No disponible
    N/A: No aplica
POBFEM:
  Descripción: Población femenina
  Definición: Total de mujeres que residen habitualmente en el país, la entidad federativa, el municipio
    o la demarcación territorial y la localidad. Incluye la estimación del número de mujeres en viviendas
    particulares sin información de ocupantes. Incluye a la población que no especificó su edad.
  Tipo: numeric
  Longitud: '9'
  Rangos: 0...999999999
  Categorías: {}
  Especiales:
    '*': Dato reservado por confidencialidad
    N/D: No disponible
    N/A: No aplica
