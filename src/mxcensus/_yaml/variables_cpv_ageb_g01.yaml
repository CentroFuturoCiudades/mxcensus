entidad:
  Descripción: Clave de entidad federativa
  Definición: Clave que identifica a la entidad federativa.
  Tipo: string
  Longitud: '2'
  Rangos: 00..32
nom_ent:
  Descripción: Entidad federativa
  Definición: Nombre oficial de la entidad federativa.
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
mun:
  Descripción: Clave de municipio ó delegación
  Definición: Clave que identifica al municipio al interior de una entidad federativa, conforme al marco
    geoestadístico nacional.
  Tipo: string
  Longitud: '3'
  Rangos: 000..570
nom_mun:
  Descripción: Municipio ó delegación
  Definición: Nombre oficial del municipio o delegación política en el caso del distrito federal.
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
loc:
  Descripción: Clave de localidad
  Definición: Clave que identifica a la localidad, al interior de cada municipio (o delegación política)
    conforme al marco geoestadístico nacional.
  Tipo: string
  Longitud: '4'
  Rangos: 0000..9999
nom_loc:
  Descripción: Localidad
  Definición: Nombre con el que se reconoce a la localidad dado por la ley o la costumbre.
  Tipo: string
  Longitud: '70'
  Rangos: Alfanumérico
ageb:
  Descripción: Clave de ageb
  Definición: Clave que identifica al ageb urbana, al interior de una localidad, de acuerdo a la desagregación
    del marco geoestadístico nacional.
  Tipo: string
  Longitud: '4'
  Rangos: 001..999,0..9, a
mza:
  Descripción: Clave de manzana
  Definición: Clave que identifica a la manzana, al interior de una ageb, de acuerdo a la desagregación
    del marco geoestadístico nacional.
  Tipo: string
  Longitud: '3'
  Rangos: 001...999
pobtot:
  Descripción: Población total
  Definición: Total de personas que residen habitualmente en el país, entidad federativa, municipio y
    localidad. Incluye la estimación del número de personas en viviendas particulares sin información
    de ocupantes. Incluye a la población que no especificó su edad.
  Tipo: numeric
  Longitud: '9'
  Rangos: 0..999999999
  Categorías: {}
  Especiales:
    '*': Dato reservado por confidencialidad
    N/D: No disponible
