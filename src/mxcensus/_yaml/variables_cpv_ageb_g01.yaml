VPH_SINTIC:
  Descripción: Viviendas particulares habitadas sin tecnologías de la información y de la comunicación
    (TIC)
  Definición: 'Viviendas particulares habitadas que no cuentan con algún aparato o dispositivo para oír
    radio; televisor; computadora, laptop o tablet; línea telefónica fija; teléfono celular; Internet;
    servicio de televisión de paga (cable o satelital); servicio de películas, música o videos de paga
    por internet ni consola de videojuegos. Comprende las viviendas particulares para las que se captaron
    las características de la vivienda, clasificadas como: casa única en el terreno; casa que comparte
    terreno con otra(s); casa dúplex; departamento en edificio; vivienda en vecindad o cuartería; vivienda
    en cuarto de azotea de un edificio y no especificado de vivienda particular. Incluye a las viviendas
    particulares sin información de ocupantes.'
  Tipo: numeric
  Longitud: '9'
  Rangos: 0…999999999
  Categorías: {}
  Especiales:
