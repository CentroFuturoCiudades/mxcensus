  Tipo: string
  Longitud: '6'
  Nota: 000000..999999 = códigos (no enumerados)
INGTOPER:
  Descripción: Ingresos totales por persona
  Tipo: string
  Longitud: '6'
  Nota: 000000..999999 = códigos (no enumerados)
NUMHIJ:
  Descripción: Total de hijos nacidos vivos
  Tipo: numeric
  Longitud: '2'
  Rango:
  - 0
  - 25
  Categorías: {}
  Especiales:
    '98': No se sabe si tiene hijos nacidos vivos o no
    '99': Se sabe que tiene hijos nacidos vivos pero no se sabe cuántos
  Nota: 00 = No tiene hijos nacidos vivos
HIJFAL:
  Descripción: Cuántos hijos han muerto
  Tipo: numeric
  Longitud: '2'
  Rango:
  - 0
  - 25
  Categorías: {}
  Especiales:
    '99': '99'
  Nota: 00 = No tiene hijos fallecidos
HIJSOB:
  Descripción: Cuántos hijos viven actualmente
  Tipo: numeric
  Longitud: '2'
  Rango:
  - 0
  - 25
  Categorías: {}
  Especiales:
    '99': '99'
  Nota: 00 = No tiene hijos vivos actualmente
FECNACM:
  Descripción: Fecha de nacimiento (mes)
  Tipo: numeric
  Longitud: '2'
  Rango:
  - 1
  - 12
  Categorías: {}
  Especiales:
    '99': '99'
FECNACA:
  Descripción: Fecha de nacimiento (año)
  Tipo: numeric
  Longitud: '4'
  Rango:
  - 1929
  - 2000
  Categorías: {}
  Especiales:
    '9999': '9999'
SOBREVI:
  Descripción: Este último vive actualmente
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Sí vive actualmente su último hijo
    '2': No vive actualmente su último hijo
  Especiales:
    '9': No especificado
EDAMORD:
  Descripción: Edad al morir (días)
  Tipo: numeric
  Longitud: '2'
  Rango:
  - 0
  - 29
  Categorías: {}
  Especiales:
    '98': Murió antes de cumplir un mes de nacido
    '99': No se sabe la edad a la que murió
  Nota: 00 = Murió antes de cumplir un día de nacido
EDAMORM:
  Descripción: Edad al morir (meses)
  Tipo: numeric
  Longitud: '2'
  Rango:
  - 1
  - 11
  Categorías: {}
  Especiales:
    '98': Murió antes de cumplir un año pero no se sabe la edad
EDAMORA:
  Descripción: Edad al morir (años)
  Tipo: numeric
  Longitud: '2'
  Rango:
  - 1
  - 98
  Categorías: {}
