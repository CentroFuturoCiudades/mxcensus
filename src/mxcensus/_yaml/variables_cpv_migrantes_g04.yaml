CVEGEO:
  Descripción: Clave geoestadística integrada, la concatenación de las claves geográficas que lleva la
    tabla (como en el Marco Geoestadístico). Microdatos — entidad + municipio (5 dígitos); estimaciones
    e ITER — + localidad (9); AGEB — + AGEB + manzana (16). Los renglones de totales llevan sus partes
    en cero (00/000/0000/0000/000). Los archivos de 2020 no la traen; harmonize=True la deriva.
  Tipo: string
  Longitud: 5 / 9 / 16
CVE_ENT:
  Descripción: Clave del Área Geoestadística Estatal (01-32; 00 = total nacional en las estimaciones).
    En 2010, 2015 y 2020 se llama ENT en los microdatos; en 2020, ENTIDAD en el ITER y el AGEB.
  Tipo: string
  Longitud: '2'
CVE_MUN:
  Descripción: Clave del Área Geoestadística Municipal (001-570; 000 = total estatal en las estimaciones,
    el ITER y el AGEB; 997 = localidades de menos de 50 000 habitantes de la entidad en las estimaciones).
    En 2010, 2015 y 2020 se llama MUN.
  Tipo: string
  Longitud: '3'
LOC50K:
  Descripción: Clave de la localidad de 50 000 y más habitantes dentro del municipio; 0000 = localidad
    de menos de 50 000 habitantes
  Tipo: string
  Longitud: '4'
ID_VIV:
  Descripción: Identificador único de la vivienda (2015, 2020 y 2025 — 12 dígitos; los dos primeros son
    la entidad, así que es único en todo el país). Los CSV de 2015 lo escriben sin el cero inicial de
    las entidades 01-09 (11 dígitos); harmonize=True lo rellena. En 2010 es un consecutivo de 8 dígitos
    único sólo dentro de la entidad; harmonize=True le antepone la entidad (entidad + consecutivo a 10
    dígitos).
  Tipo: string
  Longitud: '12'
ID_MII:
  Descripción: Identificador único del emigrante internacional (tabla de migrantes; 2020 y 2025 — 14 dígitos,
    ID_VIV + número de emigrante). Los migrantes cuelgan de la vivienda (ID_VIV), no de una persona. 2010
    trae ID_MIN, un consecutivo de 7 dígitos único dentro de la entidad; harmonize=True deriva ID_MII
    = ID_VIV + el orden del emigrante en la vivienda según ID_MIN (2 dígitos).
  Tipo: string
  Longitud: '14'
COBERTURA:
  Descripción: Tipo de cobertura en el municipio (EIC 2015, cuestionario ampliado del Censo 2020 y EIC
    2025)
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Municipio censado
    '2': Municipio muestreado
    '3': Municipio con muestra insuficiente
ESTRATO:
  Descripción: Estrato de diseño muestral (alfanumérico, p. ej. 400-01-001-0003 en 2010, 01-001-05 en
    2015, 01-001-0000-03 en 2020 y 15-001-0000-030 en 2025)
  Tipo: string
  Longitud: 9 / 14 / 15
UPM:
  Descripción: Unidad Primaria de Muestreo (4 dígitos en 2010, 6 en 2015, 5 en 2020 y 2025)
  Tipo: string
  Longitud: 4 / 5 / 6
FACTOR:
  Descripción: Factor de expansión (constante dentro de la vivienda; calibrado a las estimaciones publicadas
    — Σ FACTOR = población / viviendas particulares habitadas)
  Tipo: numeric
  Longitud: '5'
  Rango:
  - 1
  - 99999
CLAVIVP:
  Descripción: Clase de vivienda particular. Las clases 07 (local no construido para habitación) y 09
    (refugio) no tienen características de la vivienda (bloque PAREDES… SERV_TV_PAGA vacío). En 2015 los
    códigos van sin cero inicial (1…9, 99) y INEGI rotula la clase 03 «Casa dúplex, triple o cuádruple»
    y la 06 «Cuarto en la azotea de un edificio».
  Tipo: categorical
  Longitud: '2'
  Periodos:
  - '2015'
  - '2020'
  - '2025'
  Categorías:
    '01': Casa única en el terreno
    '02': Casa que comparte terreno con otra(s)
    '03': Casa dúplex
    '04': Departamento en edificio
    '05': Vivienda en vecindad o cuartería
    '06': Vivienda en cuarto de azotea de un edificio
    '07': Local no construido para habitación
    08: Vivienda móvil
    09: Refugio
  Especiales:
    '99': No especificado de vivienda particular
  Alias:
    '1': '01'
    '2': '02'
    '3': '03'
    '4': '04'
    '5': '05'
    '6': '06'
    '7': '07'
    '8': 08
    '9': 09
