NOM_ENT:
  Descripción: Nombre de la entidad
  Tipo: string
  Longitud: '50'
MUN:
  Descripción: Municipio o Delegación
  Tipo: string
  Longitud: '3'
  Nota: 001..570 = códigos (no enumerados)
NOM_MUN:
  Descripción: Nombre del municipio o delegación
  Tipo: string
  Longitud: '50'
LOC50K:
  Descripción: Clave de la localidad de 50 000 y más habitantes dentro del municipio; 0000 = localidad
    de menos de 50 000 habitantes
  Tipo: string
  Longitud: '4'
NOM_LOC:
  Descripción: Nombre de la localidad
  Tipo: string
  Longitud: '70'
ID_VIV:
  Descripción: Identificador único de la vivienda (2015, 2020 y 2025 — 12 dígitos; los dos primeros son
    la entidad, así que es único en todo el país). Los CSV de 2015 lo escriben sin el cero inicial de
    las entidades 01-09 (11 dígitos); harmonize=True lo rellena. En 2010 es un consecutivo de 8 dígitos
    único sólo dentro de la entidad; harmonize=True le antepone la entidad (entidad + consecutivo a 10
    dígitos). 2000 y 2005 no lo traen; se deriva de las partes de la clave — 2000, ENT + MUN + LOC + NUMVIV
    (15 dígitos); 2005, ENT + MUN + CONS_MUN a 7 dígitos (12).
  Tipo: string
  Longitud: '12'
CLAVIVP:
  Descripción: Clase de vivienda particular
  Pregunta: Clase de vivienda particular
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Casa independiente
    '2': Departamento en edificio
    '3': Vivienda en vecindad
    '4': Vivienda en cuarto de azotea
    '5': Local no construido para habitación
    '6': Vivienda móvil
    '7': Refugio
  Especiales:
    '9': No especificado
ID_MIN:
  Descripción: Identificación de migrante internacional
  Tipo: numeric
  Longitud: '7'
  Rango:
  - 1
  - 9999999
  Categorías: {}
MPERA:
  Descripción: Número de migrante
  Tipo: numeric
  Longitud: '2'
  Rango:
  - 0
  - 99
  Categorías: {}
MSEXO:
  Descripción: Sexo
  Pregunta: Sexo del migrante
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Hombre
    '3': Mujer
  Especiales:
    '9': No especificado
MEDAD:
  Descripción: Edad
  Pregunta: ¿Cuántos años tenía (NOMBRE) cuando se fue la última vez?
  Tipo: numeric
  Longitud: '3'
  Rango:
  - 0
  - 130
  Categorías: {}
  Especiales:
    '999': No especificado
MFECEMIM:
  Descripción: Fecha de emigración (mes)
