T_VIVHAB:
  Descripción: Total de viviendas habitadas
  Definición: Viviendas particulares y colectivas habitadas. Total de Recintos -delimitados normalmente
    por paredes y techos, cuyo acceso es independiente-que está habitado por personas, donde generalmente
    éstas preparan sus alimentos, comen, duermen y se protegen del medio ambiente. Cualquier recinto que
    al momento del censo se utilice para alojamiento, aunque no haya sido construido para habitación (faros,
    escuelas, bodegas, tiendas, fábricas, o talleres), debe ser considerado como vivienda. Asimismo, los
    locales que hayan sido construidos para habitación pero que al momento del censo se destinan para
    usos distintos, no deben ser considerados como viviendas. El total de viviendas particulares no incluye
    refugios, debido a que no se captaron características en esta clase de vivienda. Se excluyen además
    136 341 Viviendas sin información de ocupantes, las cuales se clasificaron en el rubro “No especificado”
    de la variable “Clase de vivienda particular”.
  Tipo: numeric
  Longitud: '9'
  Rangos: 0..999999999
  Categorías: {}
  Especiales:
    '*': Dato reservado por confidencialidad
VIV_PART:
