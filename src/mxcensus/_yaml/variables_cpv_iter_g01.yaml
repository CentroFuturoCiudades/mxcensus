    las personas que tenían trabajo pero no trabajaron en la semana de referencia por alguna causa temporal
    (vacaciones, licencia, enfermedad, mal tiempo, huelga o estaban en espera de iniciar o continuar con
    las labores agrícolas). Incluye también a las personas que ayudaron en el predio, fábrica, tienda
    o taller de algún familiar sin recibir sueldo o salario de ninguna especie; y a los aprendices o ayudantes
    que trabajaron sin remuneración.
  Tipo: numeric
  Longitud: '9'
  Rangos: 0..999999999
  Categorías: {}
  Especiales:
    '*': Dato reservado por confidencialidad
SEC_PRIM:
