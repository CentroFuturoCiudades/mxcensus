ENTIDAD:
  Descripción: Entidad
  Definición: Código que identifica a la entidad federativa como unidad geográfica mayor de la división
    político-administrativa del país.
  Tipo: string
  Longitud: '2'
  Rangos: 01..32
NOM_ENT:
  Descripción: Nombre de la entidad
  Definición: Nombre de la entidad.
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
MUN:
  Descripción: Municipio
  Definición: Código que identifica al municipio al interior de una entidad federativa, conforme al Marco
    Geoestadístico Nacional. Es la división territorial político-administrativa de una entidad federativa.
  Tipo: string
  Longitud: '3'
  Rangos: 001..570
NOM_MUN:
  Descripción: Nombre del municipio
  Definición: Nombre del municipio.
  Tipo: string
  Longitud: '55'
  Rangos: Alfanumérico
LOC:
  Descripción: Localidad
  Definición: Código que identifica a la localidad, al interior de cada municipio (o delegación política)
    conforme al Marco Geoestadístico Nacional. Se refiere a todo lugar ocupado por una o más viviendas
    habitadas.
  Tipo: string
  Longitud: '4'
  Rangos: 0001..9999
NOM_LOC:
  Descripción: Nombre de la localidad
  Definición: Nombre de la localidad dado por la ley o la costumbre.
  Tipo: string
  Longitud: '50'
  Rangos: Alfanumérico
LONGITUD:
  Descripción: Longitud 1/
  Definición: Ubicación de la localidad al Oeste del Meridiano de Greenwich, expresada en grados, minutos
    y segundos. Las últimas dos posiciones corresponden a los segundos; las siguientes dos posiciones
    a la izquierda indican los minutos y las dos o tres primeras posiciones de la derecha corresponden
    a los grados.
  Tipo: string
  Longitud: '7'
  Rangos: Alfanumérico
LATITUD:
  Descripción: Latitud 1/
  Definición: Ubicación de la localidad al norte del Ecuador, expresada en grados, minutos y segundos.
    Las primeras dos posiciones corresponden a los grados; las siguientes dos a los minutos y las últimas
    dos posiciones a los segundos.
  Tipo: string
  Longitud: '6'
  Rangos: Alfanumérico
ALTITUD:
  Descripción: Altitud 1/
  Definición: Altura de un punto de la tierra con relación al nivel de mar.
  Tipo: string
  Longitud: '4'
  Rangos: Alfanumérico
P_TOTAL:
  Descripción: Población total
  Definición: Total de personas que residen habitualmente en el país al momento censal, independientemente
    de su nacionalidad. Se incluye a los mexicanos que cumplen funciones diplomáticas fuera del país,
    así como a sus familiares, quienes son censados en sus respectivas adscripciones. No se incluye a
    los extranjeros que cumplen con un cargo o misión diplomática en el país, ni a sus familiares. Incluye
    la estimación de 409 023 personas correspondiente a 136 341 viviendas sin información de ocupantes.
  Tipo: numeric
  Longitud: '9'
  Rangos: 0..999999999
  Categorías: {}
  Especiales:
    '*': Dato reservado por confidencialidad
HOMBRES:
  Descripción: Hombres
