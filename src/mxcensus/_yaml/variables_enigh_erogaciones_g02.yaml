folioviv:
  Descripción: Identificador de la vivienda (folio). Los dos primeros caracteres son la clave de la entidad
    federativa.
  Tipo: string
  Longitud: 6 (2008–2012) / 10 (2014+)
  Categorías: {}
foliohog:
  Descripción: Identificador del hogar dentro de la vivienda.
  Tipo: string
  Longitud: '1'
  Categorías: {}
clave:
  Descripción: Identificador del producto
  Pregunta: De los siguientes conceptos, ¿cuánto gastó durante los meses de ________________ a _______________
    ?
  Tipo: categorical
  Longitud: '6'
  Categorías:
    '173511': Depósitos en cuentas de ahorro, tandas, cajas de ahorro, etcétera
    '173512': Préstamos a personas ajenas al hogar
    '173513': Pagos a tarjeta de crédito bancaria o comercial (incluye intereses)
    '173514': Pago de deudas a la empresa donde trabajan y/o a otras personas o instituciones (excluya
      créditos hipotecarios)
    '173515': Pago de intereses por préstamos recibidos
    '173516': Compra de monedas nacionales o extranjeras, metales preciosos, alhajas, obras de arte, etcétera
    '173517': Seguro de vida capitalizable
    '173518': Herencias, dotes y legados
    '173519': Compra de casas, condominios, locales o terrenos que no habita el hogar
    '173520': Compra de terrenos, casas o condominios que habita el hogar
    '173521': 'Pago de hipotecas de bienes inmuebles: casas, locales, terrenos, edificios, etcétera'
    '173522': Otras erogaciones no consideradas en las preguntas anteriores
    '173523': Compra de maquinaria, equipo, animales destinados a la reproducción, utilizados en negocios
      del hogar
    '173524': 'Compra de valores: cédulas, acciones y bonos'
    '173525': Compra de marcas, patentes y derechos de autor
    '173526': Balance negativo en negocios del hogar agropecuarios y no agropecuarios
    '173527': Pago de la vivienda propia y que se está pagando
    Q001: Q001
    Q002: Q002
    Q003: Q003
    Q004: Q004
    Q005: Q005
    Q006: Q006
    Q007: Q007
    Q008: Q008
    Q009: Q009
    Q010: Q010
    Q011: Q011
    Q012: Q012
    Q013: Q013
    Q014: Q014
    Q015: Q015
    Q016: Q016
    Q100: Q100
  Nota: 'códigos observados sin etiqueta en el DDI: [''Q001'', ''Q002'', ''Q003'', ''Q004'', ''Q005'',
    ''Q006'', ''Q007'', ''Q008'', ''Q009'', ''Q010'', ''Q011'', ''Q012'', ''Q013'', ''Q014'', ''Q015'',
    ''Q016'', ''Q100'']'
