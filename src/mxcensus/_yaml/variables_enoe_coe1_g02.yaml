      sindicato.
    '5': P4D1=1.-Gobierno del estado (incluye Distrito Federal); P4D1=2.-Asociación civil no clasificada
      en las opciones anteriores.
    '6': P4D1=1.-Gobierno del municipio (incluye delegaciones del Distrito Federal); P4D1=2.-Organismo
