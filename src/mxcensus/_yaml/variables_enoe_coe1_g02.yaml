    esté buscando trabajo?.
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '1': Está esperando la respuesta a una solicitud o está apalabrado con un patrón que lo llamará en
      fecha próxima
    '2': No hay trabajo en su especialidad, oficio o profesión
    '3': No cuenta con la escolaridad, los papeles o la experiencia necesaria para realizar un trabajo
