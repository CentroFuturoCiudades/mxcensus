CVEGEO:
  Descripción: Clave geoestadística integrada. Microdatos — entidad + municipio (5 dígitos); estimaciones
    — entidad + municipio + localidad (9 dígitos), con 00/000/0000 para los totales nacional, estatal
    y municipal.
  Tipo: string
  Longitud: 5 / 9
CVE_ENT:
  Descripción: Clave del Área Geoestadística Estatal (01-32; 00 = total nacional en las estimaciones)
  Tipo: string
  Longitud: '2'
CVE_MUN:
  Descripción: Clave del Área Geoestadística Municipal (001-570; en las estimaciones 000 = total estatal
    y 997 = localidades de menos de 50 000 habitantes de la entidad)
  Tipo: string
  Longitud: '3'
LOC50K:
  Descripción: Clave de la localidad de 50 000 y más habitantes dentro del municipio; 0000 = localidad
    de menos de 50 000 habitantes
  Tipo: string
  Longitud: '4'
ID_VIV:
  Descripción: Identificador único de la vivienda (2025 — 12 dígitos; los dos primeros son la entidad,
    así que es único en todo el país)
  Tipo: string
  Longitud: '12'
TIPO_REG:
  Descripción: Registro imputado — identificador de registros imputados
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '0': Encuestado
    '1': Imputado
COBERTURA:
  Descripción: Tipo de cobertura en el municipio (EIC 2025)
  Tipo: categorical
  Longitud: '1'
  Categorías:
    '1': Municipio censado
    '2': Municipio muestreado
    '3': Municipio con muestra insuficiente
ESTRATO:
  Descripción: Estrato de diseño muestral (alfanumérico, p. ej. 15-001-0000-030)
  Tipo: string
  Longitud: '15'
UPM:
  Descripción: Unidad Primaria de Muestreo
  Tipo: string
  Longitud: '5'
FACTOR:
  Descripción: Factor de expansión (constante dentro de la vivienda; calibrado a las estimaciones publicadas
    — Σ FACTOR = población / viviendas particulares habitadas)
  Tipo: numeric
  Longitud: '5'
  Rango:
  - 1
  - 99999
CLAVIVP:
  Descripción: Clase de vivienda particular. Las clases 07 (local no construido para habitación) y 09
    (refugio) no tienen características de la vivienda (bloque PAREDES… SERV_TV_PAGA vacío).
  Tipo: categorical
  Longitud: '2'
  Categorías:
    '01': Casa única en el terreno
    '02': Casa que comparte terreno con otra(s)
    '03': Casa dúplex
    '04': Departamento en edificio
    '05': Vivienda en vecindad o cuartería
    '06': Vivienda en cuarto de azotea de un edificio
    '07': Local no construido para habitación
    08: Vivienda móvil
    09: Refugio
  Especiales:
    '99': No especificado de vivienda particular
PAREDES:
  Descripción: Paredes
  Pregunta: ¿De qué material es la mayor parte de las paredes o muros de esta vivienda?
